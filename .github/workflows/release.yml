name: Release exe
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd electron && npm install && npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          files: electron/dist/*.exe
